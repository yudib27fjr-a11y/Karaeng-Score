name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -oq "$(ls *.zip | head -1)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug --no-daemon
        working-directory: KaraengFC-Android
      - run: |
          cp KaraengFC-Android/app/build/outputs/apk/debug/app-debug.apk KaraengFC.apk
          cp KaraengFC-Android/app/src/main/assets/index.html index.html
          cp KaraengFC-Android/native-version.txt native-version.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Karaeng FC ${{ github.run_number }}
          files: |
            KaraengFC.apk
            index.html
