<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Live Score Karaeng FC</title>
<meta name="theme-color" content="#0a0f24">
<meta property="og:title" content="Live Score Karaeng FC">
<meta property="og:description" content="Pantau skor Karaeng FC secara langsung">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#070b1c;--card:#0f1530;--ink:#f3f5fb;--muted:#9aa3c0;--red:#ff3b3b;--blue:#4c7dff;--gold:#ffd24a;--line:#232b4d;
--display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--body:"Barlow","Segoe UI",Roboto,Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
body{min-height:100vh;background:radial-gradient(700px 500px at 0% 0%,rgba(40,90,255,.35),transparent 70%),radial-gradient(700px 500px at 100% 20%,rgba(255,40,50,.3),transparent 70%),var(--bg);
padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(30px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;gap:12px}
.top img{width:46px;height:46px;border-radius:50%;background:#fff}
.top h1{font-family:var(--display);font-weight:900;font-size:26px;margin:0;line-height:1;text-transform:uppercase;white-space:nowrap}
.top h1 em{font-style:normal;color:var(--red)}
.top .sub{font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
.status{margin-left:auto;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:6px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.status.on{color:#fff}.status.on .dot{background:var(--red);box-shadow:0 0 10px var(--red);animation:b 1.2s infinite}
@keyframes b{50%{opacity:.3}}
.board{position:relative;overflow:hidden;border-radius:20px;padding:18px 14px 16px;background:linear-gradient(135deg,#0d2a8a 0%,#0b1033 48%,#5c0a14 100%);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.board::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 30px,rgba(255,255,255,.035) 30px 60px);pointer-events:none}
.board>*{position:relative}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#cfd6f3;gap:8px}
.pill{border-radius:20px;padding:3px 10px;font-weight:800;background:rgba(255,255,255,.12)}
.pill.live{background:var(--red);color:#fff}.pill.done{background:#1f9a52;color:#fff}
.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin-top:14px}
.side{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.logo{width:92px;height:92px;border-radius:50%;background:#fff;object-fit:contain;border:4px solid rgba(255,255,255,.2);box-shadow:0 0 30px rgba(120,160,255,.35)}
.logo.ph{display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:30px;color:#0b1640}
.nm{font-weight:700;font-size:15px;line-height:1.15;overflow-wrap:anywhere}
.score{font-family:var(--display);font-weight:900;font-size:86px;line-height:.9;font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:center}
.score i{font-style:normal;opacity:.45;font-size:56px}
.score span.pop{animation:pop .9s ease}
@keyframes pop{0%{transform:scale(1.8);color:var(--gold)}100%{transform:scale(1)}}
.clock{text-align:center;margin-top:8px;font-family:var(--display);font-weight:800;font-size:34px;color:var(--gold);font-variant-numeric:tabular-nums}
.clock small{display:block;font-family:var(--body);font-size:12px;color:#cfd6f3;font-weight:600;letter-spacing:.06em}
.goals{display:flex;flex-direction:column;gap:6px;margin-top:12px;font-size:14px}
.goal{display:flex;gap:8px;align-items:center}
.goal.o{justify-content:flex-end;text-align:right}
.goal b{font-family:var(--display);font-size:17px;color:var(--gold)}
.card{background:rgba(15,21,48,.85);border:1px solid var(--line);border-radius:16px;padding:14px}
.card h3{margin:0 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.row:first-of-type{border-top:0}
.row .no{font-family:var(--display);font-weight:800;color:var(--muted);font-size:14px;min-width:54px}
.row .sc{font-family:var(--display);font-weight:900;font-size:22px;font-variant-numeric:tabular-nums}
.row.cur{background:linear-gradient(90deg,rgba(255,59,59,.12),transparent);border-radius:8px}
.res{display:inline-block;font-family:var(--display);font-weight:900;font-size:12px;width:20px;height:20px;line-height:20px;text-align:center;border-radius:5px;color:#fff;margin-left:6px;vertical-align:middle}
.W{background:#1f9a52}.D{background:#a8891e}.L{background:#c23a32}
.wait{text-align:center;color:var(--muted);padding:40px 16px;border:1.5px dashed var(--line);border-radius:16px}
.foot{text-align:center;font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--gold);color:#1a1200;font-family:var(--display);font-weight:900;font-size:30px;padding:8px 22px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:9}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.status.on .dot,.score span.pop{animation:none}}
</style></head>

</div>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const topic = (new URLSearchParams(location.search).get("t") || location.hash.slice(1) || "").replace(/[^A-Za-z0-9_-]/g, "");
$("#crest").src = LOGOS.karaeng || "";
let data = null, recvAt = 0, lastKey = "";
const mmss = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
const logo = (id, name, cls = "logo") => LOGOS[id] ? `<img class="${cls}" src="${LOGOS[id]}" alt="">` : `<span class="${cls} ph">${esc((name || "?").slice(0, 3).toUpperCase())}</span>`;
const fmtDate = d => { try { return new Date(d + "T12:00:00").toLocaleDateString("id-ID", { weekday: "long", day: "numeric", month: "long", year: "numeric" }); } catch (e) { return d; } };
function res(g) { if (g.st !== "d") return ""; return g.k > g.s ? "W" : g.k < g.s ? "L" : "D"; }
function render() {
  if (!data) return;
  const g = data.g[data.cur] || data.g[data.g.length - 1];
  if (!g) { $("#main").innerHTML = `<div class="wait">Belum ada game hari ini.</div>`; return; }
  const key = data.g.map(x => x.k + ":" + x.s).join("|");
  const st = g.st === "l" ? `<span class="pill live">● Live</span>` : g.st === "d" ? `<span class="pill done">Selesai</span>` : `<span class="pill">Belum mulai</span>`;
  $("#main").innerHTML = `<div class="wrap" style="gap:14px">
  <section class="board">
    <div class="meta"><span>Game ${g.n} · ${esc(fmtDate(data.date))}</span>${st}</div>
    <div class="sb">
      <div class="side">${logo("karaeng", "KAR")}<span class="nm">${esc(data.kn || "Karaeng FC")}</span></div>
      <div class="score"><span id="sk">${g.k}</span><i>:</i><span id="so">${g.s}</span></div>
      <div class="side">${logo(g.o, g.on)}<span class="nm">${esc(g.on)}</span></div>
    </div>
    ${g.st === "n" ? "" : `<div class="clock"><span id="clk">${mmss(g.ms)}</span><small>dari ${g.m} menit</small></div>`}
    ${(g.gl || []).length ? `<div class="goals">${g.gl.map(([sd, mi, pl]) => `<div class="goal ${sd === "o" ? "o" : ""}">${sd === "k" ? `<b>${mi}'</b> ⚽ ${esc(pl || "Gol")}` : `${esc(pl || "Gol " + g.on)} ⚽ <b>${mi}'</b>`}</div>`).join("")}</div>` : ""}
  </section>
  ${data.g.length > 1 ? `<div class="card"><h3>Semua game hari ini</h3>${data.g.map((x, i) => `<div class="row ${i === data.cur ? "cur" : ""}"><span class="no">Game ${x.n}</span><span>${esc(data.kn || "Karaeng")} vs ${esc(x.on)}${x.st === "l" ? " · <b style='color:var(--red)'>LIVE</b>" : ""}</span><span class="sc">${x.st === "n" ? "–" : x.k + ":" + x.s}${res(x) ? `<span class="res ${res(x)}">${{ W: "M", D: "S", L: "K" }[res(x)]}</span>` : ""}</span></div>`).join("")}</div>` : ""}
  ${data.venue ? `<div class="card"><h3>Lokasi</h3>${esc(data.venue)}</div>` : ""}
  </div>`;
  if (lastKey && key !== lastKey) { const t = $("#toast"); t.hidden = false; setTimeout(() => t.hidden = true, 2600); ["#sk", "#so"].forEach(s => $(s)?.classList.add("pop")); try { navigator.vibrate?.(200); } catch (e) {} }
  lastKey = key; tick();
}
function tick() {
  if (!data) return; const g = data.g[data.cur] || data.g[data.g.length - 1], el = $("#clk");
  if (el && g) el.textContent = mmss(g.ms + (g.run ? Date.now() - recvAt : 0));
  const ago = Math.round((Date.now() - (data.ts || recvAt)) / 1000);
  $("#upd").textContent = `Diperbarui ${ago < 60 ? ago + " detik" : Math.round(ago / 60) + " menit"} lalu · halaman ini berubah otomatis`;
}
setInterval(tick, 500);
function apply(msg) { try { const d = JSON.parse(msg); if (!d || !d.g) return; if (data && d.ts && data.ts && d.ts < data.ts) return; data = d; recvAt = Date.now() - Math.max(0, Math.min(15000, Date.now() - (d.ts || Date.now()))); render(); } catch (e) {} }
function setStatus(on, txt) { $("#st").classList.toggle("on", on); $("#stt").textContent = txt; }
async function start() {
  if (!topic) { $("#main").innerHTML = `<div class="wait">Link live score tidak lengkap. Minta link terbaru dari PJ bola.</div>`; setStatus(false, "Tanpa kode"); return; }
  try { const r = await fetch(`https://ntfy.sh/${topic}/json?poll=1&since=24h`); const lines = (await r.text()).trim().split("\n").filter(Boolean); for (const l of lines) { const e = JSON.parse(l); if (e.event === "message") apply(e.message); } } catch (e) {}
  const connect = () => { const es = new EventSource(`https://ntfy.sh/${topic}/sse`);
    es.onopen = () => setStatus(true, "Live");
    es.onmessage = ev => { try { const e = JSON.parse(ev.data); if (e.event === "message") apply(e.message); } catch (er) {} };
    es.onerror = () => { setStatus(false, "Menyambung ulang…"); }; };
  connect();
}
start();
</script>
</body></html>
